# Terraform provider tests. The CI job at the end is the one check to require.
name: Tests

# Pull requests into any branch, pushes to main and manual runs. There is no path
# filter: a required check that never starts blocks the pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Concurrency is set per job, not for the whole run: cancelling a run would also
# cancel an acceptance leg that is already running against its Permit environment.
# Build, prek and generate each run once per ref at a time. A new push to a pull
# request cancels the older run of these jobs; on main, and for manual runs, the
# new one waits for it instead.

# The Terraform that the offline tests (Build) and go generate (generate) use. The
# checksum is the linux_amd64 line of the release's SHA256SUMS, whose HashiCorp
# signature was verified when the version was pinned.
env:
  TERRAFORM_VERSION: 1.16.3
  TERRAFORM_SHA256: 093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - name: Install Terraform
        run: |
          release="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSL --retry 3 --retry-connrefused -o "$zip" \
            "${release}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/terraform"
      # Unit tests and offline provider tests; the acceptance tests (TestAcc*) need
      # the Permit API and run in the test job. checkgotest exits 1 when a test fails
      # or skips, and 2 when no test runs or the tenant test against the mock never
      # runs. It is built first because go run turns every non-zero exit into 1.
      - name: Run offline tests
        shell: bash
        env:
          TF_ACC_TERRAFORM_PATH: ${{ runner.temp }}/terraform/terraform
          REQUIRED_TEST: >-
            github.com/permitio/terraform-provider-permit-io/internal/provider/tenants
            TestTenantCreateUpdateDestroy
        run: |
          go build -o "$RUNNER_TEMP/checkgotest" ./internal/acctest/checkgotest
          go test -count=1 -json -skip '^TestAcc' ./... |
            "$RUNNER_TEMP/checkgotest" -require "$REQUIRED_TEST"
      # Lists the provider schema changes a pull request makes, labelled BREAKING or
      # non-breaking, in the job summary. Breaking changes are expected while 1.0.0 is
      # prepared, so they are reported, not failed. schemadiff exits 0 (no breaking
      # change), 1 (breaking changes) or 2 (could not compare), and 2 fails the step.
      # The checkout keeps no token, so the base branch comes from the public URL.
      - name: Report provider schema changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SCHEMA: internal/provider/testdata/provider-schema.json
        run: |
          go build -o "$RUNNER_TEMP/schemadiff" ./internal/acctest/schemadiff
          git fetch --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BASE_REF"
          echo "### Provider schema changes against $BASE_REF" >>"$GITHUB_STEP_SUMMARY"
          in_base=$(git ls-tree --name-only FETCH_HEAD -- "$SCHEMA")
          if [[ -z $in_base ]]; then
            echo "no base schema: $BASE_REF has no $SCHEMA to compare with" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "FETCH_HEAD:$SCHEMA" >"$RUNNER_TEMP/base-schema.json"
          status=0
          "$RUNNER_TEMP/schemadiff" "$RUNNER_TEMP/base-schema.json" "$SCHEMA" \
            >"$RUNNER_TEMP/schemadiff.txt" || status=$?
          cat "$RUNNER_TEMP/schemadiff.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/schemadiff.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          case $status in
            0) ;;
            1) echo "::warning title=Breaking schema changes::See the job summary." ;;
            *) exit "$status" ;;
          esac
      # golangci-lint runs in the prek job; govulncheck's version comes from go.mod.
      - run: go tool govulncheck ./...

  # Runs every hook in .pre-commit-config.yaml on every file. The golangci-lint
  # version is set only there. The checksum is the release's .sha256 asset for
  # linux x86_64, which matches the one prek-action records for this version.
  prek:
    name: prek
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-prek
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PREK_VERSION: 0.5.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # CI gates only the jobs in its needs, so every other job must be listed there.
      # Exits 1 when the jobs and CI's needs differ, and 2 when no job is read.
      - name: Check that CI needs every job
        shell: bash
        env:
          WORKFLOW: .github/workflows/test.yml
        run: |
          jobs=$(yq '.jobs | keys | .[] | select(. != "ci")' "$WORKFLOW" | sort)
          needs=$(yq '.jobs.ci.needs[]' "$WORKFLOW" | sort)
          if [[ -z $jobs ]]; then
            echo "::error title=CI needs::No jobs read from $WORKFLOW."
            exit 2
          fi
          if [[ $jobs != "$needs" ]]; then
            echo "::error title=CI needs::CI's needs must list every other job in $WORKFLOW."
            diff <(echo "$jobs") <(echo "$needs") || true
            exit 1
          fi
          echo "CI needs every other job: ${jobs//$'\n'/, }."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        id: go
        with:
          go-version-file: 'go.mod'
      - name: Install prek
        env:
          PREK_SHA256: c1475ddc56df0003c780557d9b52273d9eb19c9ef8d91143f3ce03511182a36e
        run: |
          asset=prek-x86_64-unknown-linux-gnu
          archive="$RUNNER_TEMP/$asset.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused -o "$archive" \
            "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/${asset}.tar.gz"
          echo "${PREK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset" >>"$GITHUB_PATH"
      # Hook binaries are built with the job's Go, so its version is in the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: >-
            prek-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ env.PREK_VERSION }}-${{
            hashFiles('.pre-commit-config.yaml') }}
      # Exits 1 when a hook fails, and 2 when fewer than EXPECTED_HOOKS hooks pass
      # (a hook skipped, through SKIP or for want of files, or removed from the
      # config). Change EXPECTED_HOOKS when you add or remove a hook.
      - name: Run hooks
        shell: bash
        env:
          EXPECTED_HOOKS: 7
        run: |
          prek run --all-files --show-diff-on-failure --color=never |
            tee "$RUNNER_TEMP/prek.txt"
          passed=$(grep -c 'Passed$' "$RUNNER_TEMP/prek.txt" || true)
          if [[ $passed -ne $EXPECTED_HOOKS ]]; then
            echo "::error title=prek::${passed} of ${EXPECTED_HOOKS} hooks passed; see the log."
            exit 2
          fi

  # Regenerates the docs and formats the examples in a checkout directory that is
  # not named after the repository, so the output cannot depend on that name.
  generate:
    name: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-generate
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      # The same Terraform as Build, on PATH for terraform fmt and tfplugindocs.
      - name: Install Terraform
        run: |
          release="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSL --retry 3 --retry-connrefused -o "$zip" \
            "${release}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >>"$GITHUB_PATH"
      # The committed pages are deleted first, so a page that go generate does not
      # write shows up as deleted and the count below is of pages it wrote.
      # tfplugindocs deletes these directories itself before it renders.
      - name: Run go generate
        run: |
          rm -r docs/resources docs/data-sources
          go generate ./...
      # Exits 1 when go generate changed, added or deleted a file, and 2 when it
      # wrote fewer than MIN_DOCS resource and data source pages. Change MIN_DOCS
      # when you add or remove a resource or data source.
      - name: Check generated files
        env:
          MIN_DOCS: 19
        run: |
          changes=$(git status --porcelain)
          if [[ -n $changes ]]; then
            printf '%s\n' "$changes"
            git diff
            echo "::error title=go generate::Generated files differ from the commit." \
              "Run 'go generate ./...' and commit the result."
            exit 1
          fi
          shopt -s nullglob
          docs=(docs/resources/*.md docs/data-sources/*.md)
          if (( ${#docs[@]} < MIN_DOCS )); then
            echo "::error title=go generate::${#docs[@]} doc pages, expected at least ${MIN_DOCS}."
            exit 2
          fi
          echo "Generated files match the commit; ${#docs[@]} doc pages."

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # GitHub gives no repository secrets to pull requests from forks or to runs
      # whose actor is Dependabot, whatever the event and re-runs included, so those
      # runs cannot reach the Permit API.
      HAS_PERMIT_SECRETS: >-
        ${{ github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) }}
    # Each Terraform version's leg uses its own fixed Permit environment, so only one
    # leg per version runs at a time across all refs. This group never cancels a
    # running leg, and the workflow has no run-level group, so a new push does not
    # cancel one either. GitHub keeps one waiting leg per group: a newer leg from any
    # ref cancels the waiting one, and that run's CI fails until it is re-run.
    # Runs without the API key reach no environment and get a group per ref. The
    # condition repeats HAS_PERMIT_SECRETS because env is not available here.
    concurrency:
      group: >-
        acceptance-${{ (github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository))
        && 'permit' || github.ref }}-${{ matrix.terraform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.0.*'
          - '1.1.*'
          - '1.2.*'
          - '1.3.*'
          - '1.4.*'
    steps:
      - name: Explain skipped acceptance tests
        if: env.HAS_PERMIT_SECRETS != 'true'
        run: >-
          echo "::notice title=Acceptance tests skipped::This run was started by
          Dependabot or comes from a fork, so it gets no Permit API key. A maintainer
          can run the acceptance tests with Run workflow on a branch of this repository."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.HAS_PERMIT_SECRETS == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: env.HAS_PERMIT_SECRETS == 'true'
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: env.HAS_PERMIT_SECRETS == 'true'
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
        if: env.HAS_PERMIT_SECRETS == 'true'

      - name: Run tests with Terraform 1.0
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.0.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_0 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.1
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.1.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_1 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.2
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.2.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_2 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.3
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.3.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_3 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.4
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.4.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_4 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

  # The one check to require. It runs whatever happened to the jobs it needs, since
  # a skipped required check counts as passing, and fails unless each of them
  # succeeded: a failed, cancelled or skipped job fails it. Acceptance runs without
  # the API key succeed with their steps skipped. Exits 1 when a job did not
  # succeed, and 2 when the results of fewer or more than EXPECTED_JOBS jobs arrive.
  # Change EXPECTED_JOBS when you change needs.
  ci:
    name: CI
    if: always()
    needs: [build, generate, prek, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the needed jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_JOBS: 4
        run: |
          if ! results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS"); then
            echo "::error title=CI::Could not read the job results."
            exit 2
          fi
          printf '%s\n' "$results"
          count=$(grep -c . <<<"$results" || true)
          if [[ $count -ne $EXPECTED_JOBS ]]; then
            echo "::error title=CI::${count} job results, expected ${EXPECTED_JOBS}."
            exit 2
          fi
          failed=$(grep -v ' success$' <<<"$results" || true)
          if [[ -n $failed ]]; then
            echo "::error title=CI::Jobs that did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
