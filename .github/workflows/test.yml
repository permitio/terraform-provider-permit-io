# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

concurrency: ${{ github.workflow }}

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-go@v5.0.0
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      # The offline tests run Terraform against a mock Permit API. The checksum is
      # the linux_amd64 line of the release's SHA256SUMS, whose HashiCorp signature
      # was verified when the version was pinned.
      - name: Install Terraform
        env:
          TERRAFORM_VERSION: 1.16.3
          TERRAFORM_SHA256: 093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8
        run: |
          release="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSL --retry 3 --retry-connrefused -o "$zip" \
            "${release}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  ${zip}" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/terraform"
      # Unit tests and offline provider tests; the acceptance tests (TestAcc*) need
      # the Permit API and run in the test job. checkgotest exits 1 when a test fails
      # or skips, and 2 when no test runs or the tenant test against the mock never
      # runs. It is built first because go run turns every non-zero exit into 1.
      - name: Run offline tests
        shell: bash
        env:
          TF_ACC_TERRAFORM_PATH: ${{ runner.temp }}/terraform/terraform
          REQUIRED_TEST: >-
            github.com/permitio/terraform-provider-permit-io/internal/provider/tenants
            TestTenantCreateUpdateDestroy
        run: |
          go build -o "$RUNNER_TEMP/checkgotest" ./internal/acctest/checkgotest
          go test -count=1 -json -skip '^TestAcc' ./... |
            "$RUNNER_TEMP/checkgotest" -require "$REQUIRED_TEST"
      # Lists the provider schema changes a pull request makes, labelled BREAKING or
      # non-breaking, in the job summary. Breaking changes are expected while 1.0.0 is
      # prepared, so they are reported, not failed. schemadiff exits 0 (no breaking
      # change), 1 (breaking changes) or 2 (could not compare), and 2 fails the step.
      - name: Report provider schema changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SCHEMA: internal/provider/testdata/provider-schema.json
        run: |
          go build -o "$RUNNER_TEMP/schemadiff" ./internal/acctest/schemadiff
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          echo "### Provider schema changes against $BASE_REF" >>"$GITHUB_STEP_SUMMARY"
          in_base=$(git ls-tree --name-only FETCH_HEAD -- "$SCHEMA")
          if [[ -z $in_base ]]; then
            echo "no base schema: $BASE_REF has no $SCHEMA to compare with" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "FETCH_HEAD:$SCHEMA" >"$RUNNER_TEMP/base-schema.json"
          status=0
          "$RUNNER_TEMP/schemadiff" "$RUNNER_TEMP/base-schema.json" "$SCHEMA" \
            >"$RUNNER_TEMP/schemadiff.txt" || status=$?
          cat "$RUNNER_TEMP/schemadiff.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/schemadiff.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          case $status in
            0) ;;
            1) echo "::warning title=Breaking schema changes::See the job summary." ;;
            *) exit "$status" ;;
          esac
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-go@v5.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.4.0
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub gives no repository secrets to pull requests from forks or to runs
      # whose actor is Dependabot, whatever the event and re-runs included, so those
      # runs cannot reach the Permit API.
      HAS_PERMIT_SECRETS: >-
        ${{ github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.0.*'
          - '1.1.*'
          - '1.2.*'
          - '1.3.*'
          - '1.4.*'
    steps:
      - name: Explain skipped acceptance tests
        if: env.HAS_PERMIT_SECRETS != 'true'
        run: >-
          echo "::notice title=Acceptance tests skipped::This run was started by
          Dependabot or comes from a fork, so it gets no Permit API key. A maintainer
          can run the acceptance tests with Run workflow on a branch of this repository."
      - uses: actions/checkout@v4.1.1
        if: env.HAS_PERMIT_SECRETS == 'true'
      - uses: actions/setup-go@v5.0.0
        if: env.HAS_PERMIT_SECRETS == 'true'
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v2.0.3
        if: env.HAS_PERMIT_SECRETS == 'true'
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
        if: env.HAS_PERMIT_SECRETS == 'true'

      - name: Run tests with Terraform 1.0
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.0.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_0 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.1
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.1.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_1 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.2
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.2.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_2 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.3
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.3.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_3 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/

      - name: Run tests with Terraform 1.4
        if: env.HAS_PERMIT_SECRETS == 'true' && matrix.terraform == '1.4.*'
        env:
          TF_ACC: "1"
          PERMITIO_API_KEY: ${{ secrets.PERMITIO_API_KEY_1_4 }}
          PERMITIO_TIMEOUT: 20
        run: go test -count=1 -v -cover -coverpkg=./... ./internal/provider/
