# The decode failures the check allows, by the fixture label the report gives
# them. A label that no longer fails is a finding, so fix the entry when the SDK
# or the spec changes.
known_decode_failures:
  - variant: AttributeType=object
    note: The SDK's AttributeType enum lacks object, so a resource with such an
      attribute cannot be read (PER-16616).
  - variant: AttributeType=object_array
    note: The SDK's AttributeType enum lacks object_array, so a resource with such
      an attribute cannot be read (PER-16616).
  - variant: ProxyConfigRead.secret as HeadersAuth
