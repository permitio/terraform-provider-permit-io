# The triage of every operation in coverage/openapi.json, by operation ID, grouped
# by the operation's first tag in spec order. internal/acctest/apicoverage checks
# it against the spec and the provider's call sites; see its doc comment.
#
# status:
#   covered     a call site of the provider sends the operation; calls lists the
#               calls that do, named as in the apicoverage report
#   equivalent  not sent, but a covered operation does the same for the surface
#   inline      managed as an attribute of another resource, through that
#               resource's own operations
#   planned     a ticket plans a Terraform surface for it
#   excluded    the provider does not manage it
# surface: the Terraform surface: permitio_x for a resource, data.permitio_x for a
#   data source, either followed by .attribute for one attribute, and provider for
#   the provider block. Needed for covered, equivalent and inline.
# reason: needed for equivalent, planned and excluded, from this vocabulary:
#   list-variant    (equivalent) lists what the surface reads one at a time
#   bulk-variant    (equivalent) does in bulk what the surface does one at a time
#   alternate-form  (equivalent) another route to what the surface does
#   new-resource    (planned) a new resource
#   not-ga          (excluded) an early-access (EAP) operation; required for one
#                   the spec does not deprecate
#   deprecated      (excluded) deprecated in the spec; required for one it does
#   account-admin   (excluded) administers the Permit account: organizations,
#                   members, invites and API keys
#   runtime-data    (excluded) data the application manages at runtime, such as
#                   users and their tenants
#   read-only       (excluded) logs, history, statistics or derived data
#   imperative      (excluded) a one-off action, not a declared object
#   pdp-runtime     (excluded) configuration the PDPs read at runtime
#   not-planned     (excluded) no ticket plans a Terraform surface for it yet
# ticket: a ticket ID, such as PER-123, not a URL. Needed for planned, and for a
#   covered operation the spec deprecates or marks EAP: the ticket that moves the
#   provider off it.
