# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
# Set here, not taken from the git remote or the directory, so every clone names
# the files the same.
project_name: terraform-provider-permit-io
# No before hooks: a hook that changes a tracked file makes every binary report
# a +dirty version.
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like Terraform Cloud where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  # The commit is in each binary's build info (go version -m), so no flag sets it.
  ldflags:
    - '-s -w -X main.version={{.Version}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats: [zip]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  # The files carry the commit's time, as the binaries do, so two builds of a commit
  # make the same zips: the release workflow checks the published build against the
  # one it scanned.
  files:
    - src: 'LICENSE*'
      info:
        mtime: '{{ .CommitDate }}'
    - src: 'README*'
      info:
        mtime: '{{ .CommitDate }}'
    - src: 'CHANGELOG*'
      info:
        mtime: '{{ .CommitDate }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you 
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # The release workflow publishes the draft once it has checked its files. A new
  # run of the workflow replaces a draft that an earlier run left.
  draft: true
  replace_existing_draft: true
  # A tag with a prerelease suffix (v1.2.3-rc.1) makes a GitHub prerelease, which
  # GitHub never marks as the latest release.
  prerelease: auto
changelog:
  disable: true
