# Hooks run by prek (https://prek.j178.dev): `prek install` once per clone, then
# they run on every commit; CI runs `prek run --all-files` in the prek job.
# Each rev is a commit SHA and its `# frozen:` comment names the release tag.
# Dependabot updates both. The golangci-lint rev is the only place its version
# is set: CI lints through this hook.
minimum_prek_version: "0.5.3"

repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: 114493f9b3e7257d29e4130f2b4a4aadefbb6845  # frozen: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy -diff
        entry: go mod tidy -diff
        language: system
        files: (^|/)go\.(mod|sum)$|\.go$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --config, .github/zizmor.yml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
